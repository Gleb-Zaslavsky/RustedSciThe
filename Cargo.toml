[package]
name = "RustedSciThe"
version = "0.4.26"
edition = "2024"
description = "Rust framework for symbolic and numerical computing:BVP ( Newton-Raphson frozen/damped/with collocations ), IVP( BDF, Radau, Backward Euler, LSODE, LSODA, RK45, DoPri), nonlinear equations ( Levenberg, Gavin) and more"
author = "Gleb Zaslavsky"
license = "MIT"
keywords = [ "mathematics", "science", "ODE", "symbolic"]
repository = "https://github.com/Gleb-Zaslavsky/RustedSciThe"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE.txt",
    "/README.md",
    "src/**/*.rs",
    "src/**/*.cu",
    # Public guides are package documentation; internal TODO/story/test files
    # remain repository evidence and are intentionally not listed here.
    "src/**/*_USER_GUIDE_EN.md",
    "src/**/*_USER_GUIDE_RU.md",
    "src/command_interpreter/TASK_DOCS_GUIDE_EN.md",
    "src/command_interpreter/TASK_DOCUMENT_GUIDE.md",
    "src/numerical/BVP_sci/BVP_SOLVER_USER_GUIDE.md",
    "src/RST_ARCHITECTURAL_GUIDELINE.md",
    "scripts/**/*.ps1",
    "scripts/**/*.sh",
    "scripts/**/*.cmd",
    "examples/**/*.rs",
    "examples/task_docs/reference/**/*.txt",
    "benches/**/*.rs",
    # Optional repository-only performance runner source; profiles, baselines
    # and generated reports remain outside the published crate payload.
    "performance/runner/**/*.rs",
    # Repository-only material. Cargo include patterns support gitignore-style
    # negation, so keep these exclusions explicit instead of relying on a
    # broad source allowlist to remain correct forever.
    "!/.kilo",
    "!/.kilo/**/*",
    "!/Cargo.toml.orig",
    "!src/numerical/optimization/gavin_reference/**",
    "!src/numerical/ivp_scipy_reference/**",
    "!src/numerical/BVP_sci/scipy_reference/**",
    "!src/somelinalg/sparse_lu_reference/**",
    "!src/**/*[tT][eE][sS][tT]*.md",
    "!src/**/*[sS][tT][oO][rR][yY]*.md",
    "!src/**/tests/**/*.md",
    "!scripts/**/*[tT][eE][sS][tT]*.md",
    "!scripts/**/*[sS][tT][oO][rR][yY]*.md",
    "!benches/**/*[tT][eE][sS][tT]*.md",
    "!benches/**/*[sS][tT][oO][rR][yY]*.md",
    "!examples/**/*[tT][eE][sS][tT]*.md",
    "!examples/**/*[sS][tT][oO][rR][yY]*.md",
    "!examples/**/tests/**/*.md",
    "!src/**/*[tT][oO][dD][oO]*",
    "!scripts/**/*[tT][oO][dD][oO]*",
    "!benches/**/*[tT][oO][dD][oO]*",
    "!examples/**/*[tT][oO][dD][oO]*",
    "!src/command_interpreter/task_shell_cli_contract.rs",
    "!src/**/aot/**/*",
    "!src/**/generated/**/*",
    "!scripts/**/aot/**/*",
    "!scripts/**/generated/**/*",
    "!benches/**/aot/**/*",
    "!benches/**/generated/**/*",
    "!examples/**/aot/**/*",
    "!examples/**/generated/**/*",
    # Non-Rust reference/build artifacts are not crate inputs. The maintained
    # task-document fixtures below are re-added after this global filter.
    "!**/*.txt",
    "!**/*.log",
    "!**/*.py",
    "!**/*.f",
    "!**/*.c",
    "!**/*.cpp",
    "!**/*.h",
    "!**/*.dll",
    "!**/*.so",
    "!**/*.dylib",
    "!**/*.a",
    "!**/*.doc",
    "!**/*.docx",
    "!**/*.[pP][nN][gG]",
    "!**/*.[jJ][pP][gG]",
    "!**/*.[jJ][pP][eE][gG]",
    "!**/*.[gG][iI][fF]",
    "!**/*.[bB][mM][pP]",
    "!**/*.[sS][vV][gG]",
    # These are intentional public package inputs.
    "examples/task_docs/reference/**/*.txt",
    # Required source for the optional, separately built native SuperLU bridge.
    "src/somelinalg/sparse_lu_reference/superlu_bridge.c",
]

[features]
default = []
arrayfire = ["dep:arrayfire"]
# The cuda feature automatically includes arrayfire due to this line 
cuda = ["arrayfire"]
# must be added to vscode/settings.json
# {
#    "rust-analyzer.cargo.features": ["arrayfire", "cuda"]
# }
lapack = ["dep:lapack"]
openblas-system = ["lapack", "dep:openblas-src"]
# Optional SuperLU backend; the native bridge is built separately per target.
superlu = []
# Compatibility alias for the original diagnostic feature name.
superlu-experimental = ["superlu"]
# The standalone performance gate runner is opt-in and has no library impact.
perf-gates = []

[package.metadata.rust-analyzer]
cargo = { features = ["arrayfire", "cuda"] }

[[bin]]
name = "perf-gates"
path = "performance/runner/main.rs"
required-features = ["perf-gates"]
test = true
bench = false


[profile.release]
debug = false
lto = true
codegen-units = 1
panic = "abort"
[profile.dev]
opt-level = 0
debug = false 

