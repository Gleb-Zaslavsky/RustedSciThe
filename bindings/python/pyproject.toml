[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rustedscithe"
version = "0.1.1"
description = "Python bindings for RustedSciThe symbolic and numerical computing"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
dependencies = ["numpy>=2.0"]
readme = "README.md"
authors = [{ name = "RustedSciThe contributors" }]
keywords = ["numerical", "ode", "bvp", "symbolic", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
[project.urls]
Homepage = "https://github.com/Gleb-Zaslavsky/RustedSciThe"
Repository = "https://github.com/Gleb-Zaslavsky/RustedSciThe"

[tool.maturin]
bindings = "pyo3"
module-name = "rustedscithe._native"
python-source = "python"
features = ["extension-module", "abi3"]

[tool.pytest.ini_options]
markers = [
    "slow: explicit solver story outside the fast Python contract suite",
]
